<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F7FE0"/>
      <stop offset="55%" stop-color="#6FA8E8"/>
      <stop offset="100%" stop-color="#CFE4FA"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E5FB8"/>
      <stop offset="100%" stop-color="#0F2A4A"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3E1"/>
      <stop offset="60%" stop-color="#F2A83B"/>
      <stop offset="100%" stop-color="#F2A83B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="290" fill="url(#sky)"/>
  <!-- sun glow -->
  <circle cx="640" cy="120" r="130" fill="url(#sun)"/>
  <circle cx="640" cy="120" r="46" fill="#FEF3E1"/>

  <!-- soft clouds -->
  <g fill="#FFFFFF" opacity="0.5">
    <ellipse cx="150" cy="90" rx="60" ry="16"/>
    <ellipse cx="200" cy="80" rx="44" ry="13"/>
    <ellipse cx="330" cy="140" rx="50" ry="14"/>
  </g>

  <!-- sea -->
  <rect x="0" y="270" width="800" height="230" fill="url(#sea)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" fill="none">
    <path d="M0,300 Q40,292 80,300 T160,300 T240,300 T320,300 T400,300 T480,300 T560,300 T640,300 T720,300 T800,300"/>
    <path d="M0,330 Q40,322 80,330 T160,330 T240,330 T320,330 T400,330 T480,330 T560,330 T640,330 T720,330 T800,330"/>
    <path d="M0,362 Q40,354 80,362 T160,362 T240,362 T320,362 T400,362 T480,362 T560,362 T640,362 T720,362 T800,362"/>
  </g>

  <!-- distant coastline strip -->
  <path d="M0,282 Q200,262 400,280 T800,272 L800,300 L0,300 Z" fill="#123258"/>

  <!-- shoreline / promenade -->
  <path d="M0,392 Q200,368 400,388 T800,378 L800,500 L0,500 Z" fill="#E9EDF3"/>
  <path d="M0,392 Q200,368 400,388 T800,378" fill="none" stroke="#D7DEE9" stroke-width="6"/>

  <!-- row of houses along the promenade -->
  <g>
    <!-- house template reused with translate/scale via <use> would need defs; keep simple inline shapes -->
    <!-- house 1 -->
    <g transform="translate(40,330) scale(1.05)">
      <rect x="-26" y="18" width="52" height="42" fill="#0F2A4A"/>
      <polygon points="-32,18 0,-10 32,18" fill="#0F2A4A"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 2 -->
    <g transform="translate(118,340) scale(0.85)">
      <rect x="-26" y="18" width="52" height="42" fill="#163C66"/>
      <polygon points="-32,18 0,-10 32,18" fill="#163C66"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 3 taller -->
    <g transform="translate(190,320) scale(1.2)">
      <rect x="-24" y="4" width="48" height="56" fill="#0F2A4A"/>
      <polygon points="-30,4 0,-24 30,4" fill="#0F2A4A"/>
      <rect x="-9" y="14" width="9" height="9" fill="#F2A83B"/>
      <rect x="3" y="14" width="9" height="9" fill="#F2A83B"/>
      <rect x="-9" y="30" width="9" height="9" fill="#F2A83B"/>
      <rect x="3" y="30" width="9" height="9" fill="#F2A83B"/>
    </g>
    <!-- house 4 -->
    <g transform="translate(272,338) scale(0.9)">
      <rect x="-26" y="18" width="52" height="42" fill="#163C66"/>
      <polygon points="-32,18 0,-10 32,18" fill="#163C66"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 5 -->
    <g transform="translate(346,326) scale(1.1)">
      <rect x="-26" y="18" width="52" height="42" fill="#0F2A4A"/>
      <polygon points="-32,18 0,-10 32,18" fill="#0F2A4A"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 6 -->
    <g transform="translate(424,342) scale(0.8)">
      <rect x="-26" y="18" width="52" height="42" fill="#163C66"/>
      <polygon points="-32,18 0,-10 32,18" fill="#163C66"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 7 tall tower -->
    <g transform="translate(494,314) scale(1.3)">
      <rect x="-20" y="-6" width="40" height="66" fill="#0F2A4A"/>
      <polygon points="-25,-6 0,-30 25,-6" fill="#0F2A4A"/>
      <rect x="-8" y="4" width="7" height="7" fill="#F2A83B"/>
      <rect x="2" y="4" width="7" height="7" fill="#F2A83B"/>
      <rect x="-8" y="18" width="7" height="7" fill="#F2A83B"/>
      <rect x="2" y="18" width="7" height="7" fill="#F2A83B"/>
      <rect x="-8" y="32" width="7" height="7" fill="#F2A83B"/>
      <rect x="2" y="32" width="7" height="7" fill="#F2A83B"/>
    </g>
    <!-- house 8 -->
    <g transform="translate(578,336) scale(0.95)">
      <rect x="-26" y="18" width="52" height="42" fill="#163C66"/>
      <polygon points="-32,18 0,-10 32,18" fill="#163C66"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 9 -->
    <g transform="translate(654,322) scale(1.1)">
      <rect x="-26" y="18" width="52" height="42" fill="#0F2A4A"/>
      <polygon points="-32,18 0,-10 32,18" fill="#0F2A4A"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 10 -->
    <g transform="translate(728,344) scale(0.82)">
      <rect x="-26" y="18" width="52" height="42" fill="#163C66"/>
      <polygon points="-32,18 0,-10 32,18" fill="#163C66"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
    <!-- house 11 -->
    <g transform="translate(790,332) scale(1)">
      <rect x="-26" y="18" width="52" height="42" fill="#0F2A4A"/>
      <polygon points="-32,18 0,-10 32,18" fill="#0F2A4A"/>
      <rect x="-9" y="34" width="10" height="10" fill="#F2A83B"/>
      <rect x="7" y="34" width="10" height="10" fill="#F2A83B"/>
    </g>
  </g>

  <!-- palm accents -->
  <g fill="#123258">
    <path d="M70,392 C66,360 78,336 90,326 C82,352 82,374 84,392 Z"/>
    <path d="M90,326 C70,318 54,320 44,330 C62,326 76,330 90,326 Z"/>
    <path d="M90,326 C96,312 110,306 124,308 C108,312 98,320 90,326 Z"/>
    <path d="M90,326 C100,316 116,316 128,324 C112,320 100,322 90,326 Z"/>
    <rect x="86" y="392" width="7" height="6" fill="#123258"/>
  </g>
  <g fill="#123258">
    <path d="M712,388 C708,358 719,336 730,326 C723,350 723,370 725,388 Z"/>
    <path d="M730,326 C712,318 698,320 689,330 C705,326 718,330 730,326 Z"/>
    <path d="M730,326 C736,313 749,308 761,310 C747,313 738,320 730,326 Z"/>
  </g>

  <!-- foreground promenade rail -->
  <g stroke="#B9C4D6" stroke-width="3" opacity="0.6">
    <line x1="0" y1="404" x2="800" y2="392"/>
  </g>
</svg>
